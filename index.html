<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fef6e4">
<title>发音小能手 · 声调 / 声母 / 韵母</title>
<style>
:root{
  --bg:#fef6e4;
  --bg2:#ffeeda;
  --ink:#3b2f2f;
  --ink-soft:#8a7a72;
  --card:#fffdf9;
  --line:#f0e0cf;
  --candy:#ff8a5b;
  --candy2:#ffb703;
  --mint:#4cc9a0;
  --sky:#63b4ff;
  --grape:#a78bfa;
  --pink:#ff9ec4;
  --red:#ef4b4b;
  --green:#2fb37b;
  --shadow:0 8px 0 rgba(180,140,110,.18), 0 14px 30px rgba(180,140,110,.16);
  --shadow-sm:0 4px 0 rgba(180,140,110,.16);
  --r:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:"Yuanti SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(1200px 600px at 10% -10%, #fff6c9 0%, transparent 60%),
    radial-gradient(900px 500px at 110% 10%, #d9f2ff 0%, transparent 55%),
    linear-gradient(160deg, var(--bg) 0%, var(--bg2) 100%);
  min-height:100vh;
  overflow-x:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.app{max-width:1120px;margin:0 auto;padding:18px 18px 40px;position:relative}
.hidden{display:none !important}

/* ---------- 通用胶囊按钮 ---------- */
.pill{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 18px;border-radius:999px;background:#fff;
  box-shadow:var(--shadow-sm);font-weight:800;font-size:15px;
  transition:transform .12s ease, box-shadow .12s ease;
}
.pill:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(180,140,110,.16)}
.pill.primary{background:linear-gradient(180deg,#ffb26b,#ff8a5b);color:#fff;box-shadow:0 5px 0 #e0703f,0 10px 20px rgba(255,138,91,.35)}
.pill.primary:active{box-shadow:0 2px 0 #e0703f}
.pill.ghost{background:rgba(255,255,255,.72);border:2px solid var(--line)}

/* ---------- 顶部栏 ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px;letter-spacing:.5px}
.brand .logo{
  width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:22px;
  background:linear-gradient(145deg,#ffe08a,#ffb168);box-shadow:var(--shadow-sm);transform:rotate(-6deg)
}
.top-actions{display:flex;align-items:center;gap:8px}
.icon-btn{
  width:44px;height:44px;border-radius:16px;background:#fff;box-shadow:var(--shadow-sm);
  display:grid;place-items:center;font-size:20px;transition:transform .12s
}
.icon-btn:active{transform:scale(.94)}
.icon-btn.off{opacity:.45}

/* ---------- 首页 ---------- */
.home{padding-top:6px}
.hero{
  background:var(--card);border-radius:32px;padding:26px 26px 22px;box-shadow:var(--shadow);
  position:relative;overflow:hidden;border:3px solid #fff
}
.hero:before{
  content:"";position:absolute;inset:auto -40px -80px auto;width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,#ffe9a8,#ffd16600 70%);pointer-events:none
}
.hero h1{margin:0 0 6px;font-size:30px;letter-spacing:1px}
.hero p{margin:0;color:var(--ink-soft);font-weight:600}
.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}
.mode-card{
  background:#fff;border-radius:26px;padding:18px 16px;text-align:left;box-shadow:var(--shadow-sm);
  border:3px solid transparent;transition:.18s;position:relative;overflow:hidden
}
.mode-card .mc-icon{font-size:34px;display:block;margin-bottom:6px}
.mode-card .mc-title{font-weight:900;font-size:20px}
.mode-card .mc-sub{color:var(--ink-soft);font-size:13px;font-weight:600;margin-top:4px;line-height:1.5}
.mode-card .mc-tag{
  position:absolute;right:12px;top:12px;font-size:11px;font-weight:800;color:#fff;
  padding:3px 9px;border-radius:999px;background:var(--candy)
}
.mode-card.selected{border-color:var(--candy);transform:translateY(-3px);box-shadow:0 10px 0 rgba(255,138,91,.2),0 16px 30px rgba(255,138,91,.22)}
.mode-card:hover{transform:translateY(-3px)}

.setup{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.setup-box{background:#fff;border-radius:24px;padding:16px 18px;box-shadow:var(--shadow-sm)}
.setup-box h3{margin:0 0 10px;font-size:15px;color:var(--ink-soft);letter-spacing:.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  padding:8px 14px;border-radius:999px;background:#f7efe4;font-weight:800;font-size:14px;
  border:2px solid transparent;transition:.15s
}
.chip:hover{background:#f2e5d5}
.chip.on{background:#fff4e2;border-color:var(--candy);color:#d96a35}
.chip.small{padding:6px 12px;font-size:13px}
.start-row{display:flex;justify-content:center;margin-top:18px}
.big-start{
  font-size:22px;font-weight:900;padding:16px 46px;border-radius:999px;color:#fff;
  background:linear-gradient(180deg,#5fd3a8,#2fb37b);box-shadow:0 7px 0 #238b5d,0 16px 26px rgba(47,179,123,.35);
  letter-spacing:2px;transition:.12s
}
.big-start:active{transform:translateY(4px);box-shadow:0 3px 0 #238b5d}
.big-start:disabled{filter:grayscale(.6);opacity:.6}

/* ---------- 游戏页 ---------- */
.game-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:10px
}
.game-info{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.game-title{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px}
.game-title .badge{font-size:12px;padding:4px 10px;border-radius:999px;background:#fff;box-shadow:var(--shadow-sm);color:var(--ink-soft)}
.progress-wrap{display:flex;align-items:center;gap:10px}
.progress{flex:1;height:16px;border-radius:999px;background:#fff;box-shadow:inset 0 2px 6px rgba(180,140,110,.2);overflow:hidden;max-width:420px}
.progress > i{display:block;height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#ffd166,#ff8a5b,#ff6b9d);transition:width .45s cubic-bezier(.2,.9,.3,1.2)}
.progress-num{font-weight:900;font-size:14px;color:var(--ink-soft);white-space:nowrap}

/* 拼图面板 */
.puzzle-panel{
  width:230px;flex-shrink:0;background:#fff;border-radius:24px;padding:10px;box-shadow:var(--shadow-sm);
  position:relative
}
.puzzle-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 8px;font-size:12px;font-weight:800;color:var(--ink-soft)}
.puzzle-svg{display:block;width:100%;height:auto;border-radius:14px;overflow:hidden;background:#f7f1ea}
.puzzle-svg .piece{
  stroke:#fff;stroke-width:2.5;transition:fill .5s ease, filter .5s ease, transform .3s ease;
  transform-origin:center
}
.puzzle-svg .piece.lit{filter:saturate(1.15) drop-shadow(0 2px 3px rgba(0,0,0,.12))}
.puzzle-svg .piece.pop{animation:piecePop .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes piecePop{0%{transform:scale(.85)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.puzzle-label{text-align:center;font-size:12px;font-weight:800;color:var(--ink-soft);padding-top:6px}

/* 题面 */
.stage{
  background:var(--card);border-radius:30px;padding:24px 22px 22px;box-shadow:var(--shadow);
  border:3px solid #fff;margin-top:4px;position:relative
}
.ask{
  text-align:center;font-weight:900;font-size:20px;margin:0 0 4px;letter-spacing:.5px
}
.ask .hl{color:#e4703b}
.hint{text-align:center;color:var(--ink-soft);font-size:14px;font-weight:600;margin-bottom:16px}

/* 拼音卡片 */
.cards{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin:6px 0 8px}
.pcard{
  width:132px;min-height:132px;border-radius:24px;background:#fff;box-shadow:var(--shadow-sm);
  border:3px solid #f3e8db;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:10px;transition:transform .16s, box-shadow .16s, background .2s, border-color .2s;
  position:relative;overflow:hidden
}
.pcard:hover{transform:translateY(-4px);border-color:#ffd7a8}
.pcard:active{transform:translateY(0) scale(.98)}
.pcard .num{
  position:absolute;left:10px;top:8px;font-size:11px;font-weight:900;color:#cbb5a1
}
.pcard .speaker{font-size:26px;line-height:1}
.pcard .wave{display:flex;align-items:flex-end;gap:3px;height:16px}
.pcard .wave i{width:4px;border-radius:2px;background:#ffb168;height:6px;animation:none}
.pcard.playing .wave i{animation:wave .7s ease-in-out infinite}
.pcard.playing .wave i:nth-child(2){animation-delay:.12s}
.pcard.playing .wave i:nth-child(3){animation-delay:.24s}
.pcard.playing .wave i:nth-child(4){animation-delay:.36s}
@keyframes wave{0%,100%{height:5px}50%{height:16px}}
.pcard .tip{font-size:12px;color:#bfa892;font-weight:700}

/* 声调模式：显示后的拼音 */
.pcard .py{
  font-family:"Times New Roman",Georgia,serif;font-size:30px;font-weight:700;letter-spacing:.5px;line-height:1.15;
  color:#4a3b33
}
.pcard .hanzi{font-size:13px;color:#b6a292;font-weight:700}
.pcard.reveal .py{animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* 正确 / 错误 */
.pcard.correct{
  background:linear-gradient(180deg,#eafff5,#d6fbe9);border-color:var(--green);
  box-shadow:0 6px 0 rgba(47,179,123,.3),0 16px 34px rgba(47,179,123,.3);
  transform:scale(1.22);z-index:3
}
.pcard.correct .py{font-size:40px;color:#1d7a52}
.pcard.correct .speaker,.pcard.correct .tip{opacity:0}
.pcard.wrong{background:#ffe9e9;border-color:var(--red);animation:shake .38s}
.pcard.wrong .py,.pcard.wrong .char{color:var(--red)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pcard.dim{opacity:.45}
.pcard .odd-badge{
  position:absolute;top:-2px;right:-2px;background:var(--candy2);color:#7a4b00;font-size:11px;font-weight:900;
  padding:3px 8px;border-radius:0 20px 0 14px
}

/* 声母/韵母选项 */
.options{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:18px;min-height:78px}
.opt{
  min-width:86px;padding:14px 20px;border-radius:22px;background:#fff;box-shadow:var(--shadow-sm);
  border:3px solid #f3e8db;font-family:"Times New Roman",Georgia,serif;
  font-size:28px;font-weight:700;color:#4a3b33;transition:.15s;position:relative
}
.opt:hover{transform:translateY(-3px);border-color:#ffd7a8}
.opt:active{transform:scale(.97)}
.opt .spk{position:absolute;right:7px;bottom:4px;font-size:13px;opacity:.5}
.opt.correct{background:#dcf9ea;border-color:var(--green);color:#1d7a52;box-shadow:0 5px 0 rgba(47,179,123,.3)}
.opt.wrong{background:#ffe4e4;border-color:var(--red);color:var(--red);animation:shake .38s}
.opt.dim{opacity:.4}
.opt.reveal-answer{border-color:var(--green);border-style:dashed;background:#f2fff9;color:#1d7a52}

/* 反馈气泡 */
.toast{
  position:fixed;left:50%;top:26%;transform:translate(-50%,-10px) scale(.9);z-index:60;
  padding:16px 30px;border-radius:999px;font-weight:900;font-size:22px;color:#fff;
  background:linear-gradient(180deg,#5fd3a8,#2fb37b);box-shadow:0 10px 30px rgba(47,179,123,.4);
  opacity:0;pointer-events:none;transition:.28s cubic-bezier(.2,1.5,.4,1);white-space:nowrap
}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.toast.bad{background:linear-gradient(180deg,#ff8f8f,#e64b4b);box-shadow:0 10px 30px rgba(230,75,75,.35)}
.toast.info{background:linear-gradient(180deg,#8ec9ff,#4b9bf0);box-shadow:0 10px 30px rgba(75,155,240,.35)}

/* ---------- 弹层 ---------- */
.modal-mask{
  position:fixed;inset:0;background:rgba(60,45,38,.45);backdrop-filter:blur(3px);z-index:70;
  display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:.22s
}
.modal-mask.show{opacity:1;pointer-events:auto}
.sheet{
  background:var(--card);border-radius:32px;padding:26px;width:min(620px,100%);box-shadow:0 24px 60px rgba(60,40,25,.3);
  transform:translateY(16px) scale(.97);transition:.28s cubic-bezier(.2,1.4,.4,1);max-height:88vh;overflow:auto;
  border:3px solid #fff
}
.modal-mask.show .sheet{transform:none}
.sheet h2{margin:0 0 4px;font-size:26px;text-align:center}
.sheet .sub{text-align:center;color:var(--ink-soft);font-weight:700;margin-bottom:16px}

.stars{display:flex;justify-content:center;gap:6px;font-size:40px;margin:6px 0 12px}
.stars .s{opacity:.18;transform:scale(.8);transition:.4s}
.stars .s.on{opacity:1;transform:scale(1);filter:drop-shadow(0 4px 6px rgba(255,180,60,.5))}

.result-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0 6px}
.metric{background:#fff;border-radius:18px;padding:12px 8px;text-align:center;box-shadow:var(--shadow-sm)}
.metric b{display:block;font-size:24px;line-height:1.2}
.metric span{font-size:12px;color:var(--ink-soft);font-weight:800}

.round-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.rrow{
  display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:9px 12px;
  box-shadow:var(--shadow-sm);font-size:14px
}
.rrow .idx{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-weight:900;font-size:12px;background:#f3ede4;color:#9a887a;flex-shrink:0}
.rrow .idx.ok{background:#dcf9ea;color:#1d7a52}
.rrow .idx.no{background:#ffe4e4;color:#c93b3b}
.rrow .py{font-family:"Times New Roman",Georgia,serif;font-weight:700;font-size:16px;min-width:74px}
.rrow .txt{color:var(--ink-soft);font-weight:650;font-size:13px;flex:1;min-width:0}
.rrow .res{font-weight:900;font-size:13px}
.rrow .res.ok{color:var(--green)}
.rrow .res.no{color:var(--red)}
.sheet-actions{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}

/* 历史记录 */
.hist-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.hist-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.hcard{background:#fff;border-radius:18px;padding:14px;text-align:center;box-shadow:var(--shadow-sm)}
.hcard b{display:block;font-size:26px}
.hcard span{font-size:12px;color:var(--ink-soft);font-weight:800}
.hist-item{background:#fff;border-radius:18px;padding:12px 14px;box-shadow:var(--shadow-sm);margin-bottom:9px;display:flex;align-items:center;gap:12px}
.hist-item .dot{width:10px;height:38px;border-radius:6px;flex-shrink:0}
.hist-item .hi-main{flex:1;min-width:0}
.hist-item .hi-main b{font-size:15px}
.hist-item .hi-main small{display:block;color:var(--ink-soft);font-weight:650;font-size:12px;margin-top:2px}
.hist-item .hi-score{font-weight:900;font-size:16px}
.hist-empty{text-align:center;color:var(--ink-soft);font-weight:700;padding:30px 0}

/* 满轮庆祝 */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.confetti i{position:absolute;width:10px;height:16px;border-radius:3px;top:-20px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* 响应式 */
@media (max-width:820px){
  .mode-grid{grid-template-columns:1fr}
  .setup{grid-template-columns:1fr}
  .puzzle-panel{width:150px}
  .pcard{width:calc(50% - 8px);min-height:110px}
  .cards{gap:10px}
  .pcard.correct{transform:scale(1.06)}
  .hero h1{font-size:24px}
  .ask{font-size:17px}
  .result-grid{grid-template-columns:repeat(2,1fr)}
}

/* ---------- v2 新增 ---------- */
/* 首页：只有模式卡片，居中大按钮 */
.home{padding-top:26px}
.mode-grid.solo{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:760px;margin:0 auto}
.mode-card.center{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  padding:34px 16px;text-align:center;background:#fff;border-radius:28px;
  box-shadow:var(--shadow-sm);border:3px solid transparent;transition:.18s
}
.mode-card.center .mc-icon{font-size:46px;margin:0}
.mode-card.center .mc-title{font-size:26px;font-weight:900;letter-spacing:2px}
.mode-card.center:hover{transform:translateY(-4px);box-shadow:0 10px 0 rgba(180,140,110,.14),0 18px 34px rgba(180,140,110,.18)}
.mode-card.center:active{transform:translateY(-1px)}

/* 难度选择弹窗 */
.setup-sheet{width:min(480px,100%)}
.setup-block{background:#fff;border-radius:20px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.setup-block h3{margin:0 0 10px;font-size:14px;color:var(--ink-soft);letter-spacing:.5px}

/* 声调遮罩：盖住卡片拼音的声调部分 */
.pcard{position:relative}
.pcard .py{position:relative;display:inline-block;letter-spacing:.5px}
.tone-cover{
  position:absolute;right:-2px;top:-8px;width:14px;height:14px;
  background:var(--card);border-radius:4px;z-index:2;transition:opacity .25s
}
.tone-opt .tone-label{font-family:inherit;font-size:22px;font-weight:800}

/* 拼图碎片 */
.puzzle-svg .pfrag{transition:fill .4s}
.puzzle-svg .pfrag.pop{animation:piecePop .55s cubic-bezier(.2,1.6,.4,1)}
.puzzle-svg .art-gray{pointer-events:none}

@media (max-width:820px){
  .mode-grid.solo{grid-template-columns:1fr;gap:12px;max-width:320px}
  .mode-card.center{padding:22px 16px;flex-direction:row;justify-content:flex-start;gap:16px}
  .mode-card.center .mc-icon{font-size:36px;margin:0}
  .mode-card.center .mc-title{font-size:22px}
}

/* ---------- v3 ---------- */
/* 1) 仅首页模式按钮垂直居中，游戏页保持原本顶部对齐的布局 */
#screenHome.home{
  min-height:calc(100vh - 150px);
  display:flex;align-items:center;justify-content:center;
  padding-bottom:6vh;
}
#screenHome .mode-grid.solo{width:100%}

/* 2) 声调：选项是卡片正下方的小按钮 */
#cards.with-options{gap:16px;align-items:flex-start}
#cards .card-col{display:flex;flex-direction:column;align-items:stretch;gap:9px;width:132px}
#cards .card-col .pcard{width:100%}
.opt.under-opt{
  min-width:0;width:100%;padding:9px 0;border-radius:16px;
  font-family:inherit;font-size:17px;font-weight:900;
  background:#f7efe4;border:2px solid transparent;box-shadow:none;
  display:flex;align-items:center;justify-content:center;gap:6px
}
.opt.under-opt:hover{background:#f2e5d5;transform:translateY(-2px);border-color:#ffd7a8}
.opt.under-opt .dot{
  width:22px;height:22px;border-radius:50%;background:#fff;display:grid;place-items:center;
  font-size:12px;color:#a58e79;font-weight:900
}
.opt.under-opt.correct{background:#dcf9ea;border-color:var(--green);color:#1d7a52}
.opt.under-opt.wrong{background:#ffe4e4;border-color:var(--red);color:var(--red);animation:shake .38s}
.opt.under-opt.dim{opacity:.45}

/* 3) 下一题按钮 */
.next-btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin:22px auto 2px;padding:15px 44px;border-radius:999px;
  font-size:20px;font-weight:900;letter-spacing:2px;color:#fff;
  background:linear-gradient(180deg,#5fd3a8,#2fb37b);
  box-shadow:0 6px 0 #238b5d,0 14px 24px rgba(47,179,123,.35);
  transition:transform .12s;animation:nextIn .35s cubic-bezier(.2,1.5,.4,1)
}
.next-btn:active{transform:translateY(3px);box-shadow:0 3px 0 #238b5d}
.next-btn .arr{font-size:18px;opacity:.9}
@keyframes nextIn{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:none}}

/* 历史记录存储警告 */
.store-warn{
  background:#fff6e0;border:2px solid #ffd89b;color:#8a5a00;border-radius:14px;
  padding:10px 12px;font-size:13px;font-weight:700;line-height:1.6;margin-bottom:10px
}

@media (max-width:820px){
  #cards.with-options{gap:10px;flex-wrap:wrap}
  #cards .card-col{width:calc(50% - 5px)}
  .opt.under-opt{padding:8px 0;font-size:15px}
}

/* ---------- v4 ---------- */
/* 首页总积分 */
#screenHome.home{flex-direction:column;gap:26px}
.home-score{width:100%;display:flex;justify-content:center}
.score-chip{
  display:inline-flex;align-items:center;gap:14px;background:#fff;border-radius:999px;
  padding:12px 22px;box-shadow:var(--shadow-sm);border:3px solid #fff
}
.score-chip .sc-ico{font-size:26px}
.score-chip .sc-main{display:flex;align-items:baseline;gap:7px}
.score-chip .sc-main b{font-size:28px;font-weight:900;color:#e4703b;line-height:1}
.score-chip .sc-main small{font-size:12px;font-weight:800;color:var(--ink-soft)}
.score-chip .sc-side{font-size:13px;font-weight:800;color:var(--ink-soft);
  padding-left:14px;border-left:2px dashed var(--line)}

/* 暂停按钮 */
#btnPause{font-size:19px}

/* 暂停弹层 */
.pause-sheet{width:min(360px,100%);text-align:center}
.pause-actions{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.pill.wide{width:100%;justify-content:center;padding:14px 18px;font-size:17px}

/* 声调：四个声调选项 */
.tone-picker{
  display:flex;justify-content:center;gap:14px;flex-wrap:wrap;margin-top:22px;
  animation:nextIn .3s cubic-bezier(.2,1.5,.4,1)
}
.tone-choice{
  width:88px;height:88px;border-radius:24px;background:#fff;box-shadow:var(--shadow-sm);
  border:3px solid #f3e8db;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2px;transition:.15s;position:relative
}
.tone-choice:hover{transform:translateY(-4px);border-color:#ffd7a8}
.tone-choice:active{transform:scale(.96)}
.tone-choice .tc-mark{font-family:"Times New Roman",Georgia,serif;font-size:30px;line-height:1;color:#4a3b33}
.tone-choice .tc-num{font-size:12px;font-weight:900;color:#bfa892}
.tone-choice.correct{background:#dcf9ea;border-color:var(--green);box-shadow:0 5px 0 rgba(47,179,123,.32)}
.tone-choice.correct .tc-mark,.tone-choice.correct .tc-num{color:#1d7a52}
.tone-choice.wrong{background:#ffe4e4;border-color:var(--red);animation:shake .38s}
.tone-choice.wrong .tc-mark{color:var(--red)}
.tone-choice.dim{opacity:.38}

/* 声调卡片：选中（听音）高亮，不揭示声调 */
.pcard.tone-card{padding-top:16px}
.pcard.tone-card .py{font-size:34px}
.pcard.tone-card.picked{
  border-color:#63b4ff;background:#f2f9ff;
  box-shadow:0 5px 0 rgba(99,180,255,.3),0 14px 26px rgba(99,180,255,.25);
  transform:translateY(-4px)
}
.pcard.tone-card.picked .tip{color:#4b9bf0}
.pcard.tone-card.picked::after{
  content:"已选中";position:absolute;left:50%;bottom:2px;transform:translateX(-50%);
  font-size:10px;font-weight:900;color:#4b9bf0;letter-spacing:.5px
}
.pcard.tone-card.correct{transform:scale(1.14)}
.pcard.tone-card.correct::after{content:none}

/* 声母/韵母卡片上的汉字 */
.pcard .char{font-size:40px;font-weight:800;line-height:1.1}

/* 拼图可点击 */
.puzzle-panel{cursor:pointer;transition:transform .15s}
.puzzle-panel:active{transform:scale(.98)}
.puzzle-tap{
  position:absolute;left:0;right:0;bottom:-4px;text-align:center;
  font-size:11px;font-weight:800;color:#c3ae9a
}

/* 放大庆祝 */
.celebrate-mask{
  position:fixed;inset:0;background:rgba(60,45,38,.5);backdrop-filter:blur(4px);z-index:85;
  display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:.24s
}
.celebrate-mask.show{opacity:1;pointer-events:auto}
.celebrate-card{
  background:var(--card);border-radius:34px;padding:22px 22px 20px;width:min(380px,100%);
  box-shadow:0 24px 70px rgba(60,40,25,.36);border:4px solid #fff;text-align:center;
  transform:scale(.86);transition:.34s cubic-bezier(.2,1.5,.4,1)
}
.celebrate-mask.show .celebrate-card{transform:scale(1)}
.celeb-tag{
  display:inline-block;background:linear-gradient(180deg,#ffd166,#ffb703);color:#7a4b00;
  font-size:13px;font-weight:900;padding:5px 16px;border-radius:999px;letter-spacing:1px;margin-bottom:12px
}
.celebrate-card svg{
  display:block;width:100%;max-width:260px;margin:0 auto;border-radius:22px;
  background:#f7f1ea;box-shadow:inset 0 0 0 3px #fff;
  animation:celebPop .55s cubic-bezier(.2,1.6,.4,1)
}
@keyframes celebPop{0%{transform:scale(.7) rotate(-4deg)}60%{transform:scale(1.06) rotate(2deg)}100%{transform:scale(1)}}
.celeb-name{font-size:22px;font-weight:900;margin-top:14px}
.celeb-note{font-size:13px;font-weight:700;color:var(--ink-soft);margin:6px 0 16px}

/* 成绩单分数行 */
.total-line{
  display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;
  background:#fff8ec;border-radius:16px;padding:10px 14px;margin:4px 0 12px;
  font-size:14px;font-weight:800;color:var(--ink-soft)
}
.total-line b{font-size:20px;color:#e4703b}
.total-line b.big{font-size:26px;color:#d1500f}
.total-line em{
  font-style:normal;font-size:11px;font-weight:900;color:#1d7a52;background:#dcf9ea;
  padding:3px 8px;border-radius:999px
}

/* 历史记录可点击 */
.hist-item{
  width:100%;text-align:left;border:none;background:#fff;
  border-radius:18px;padding:12px 14px;box-shadow:var(--shadow-sm);margin-bottom:9px;
  display:flex;align-items:center;gap:12px;transition:.15s;cursor:pointer
}
.hist-item:hover{transform:translateX(3px);box-shadow:0 6px 0 rgba(180,140,110,.14)}
.hist-item:active{transform:scale(.99)}
.hist-item .hi-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0}
.hist-item .hi-score{font-weight:900;font-size:15px}
.hist-item .hi-stars{font-size:10px;letter-spacing:-1px;opacity:.85}
.hist-item .hi-arrow{font-size:22px;color:#d6c2ae;font-weight:900;margin-left:2px}
.detail-note{text-align:center;color:var(--ink-soft);font-weight:700;padding:18px 0;font-size:13px}

@media (max-width:820px){
  .score-chip{padding:10px 16px;gap:10px}
  .score-chip .sc-main b{font-size:24px}
  .score-chip .sc-side{padding-left:10px;font-size:12px}
  .tone-picker{gap:10px}
  .tone-choice{width:calc(25% - 8px);min-width:64px;height:76px;border-radius:20px}
  .tone-choice .tc-mark{font-size:26px}
  .pcard.tone-card .py{font-size:28px}
  .celebrate-card{padding:18px}
}

/* ---------- v5 ---------- */
/* 1) 右上角：改为积分数板（去掉拼图） */
.game-head{align-items:flex-start}
.score-panel{
  flex-shrink:0;min-width:186px;background:#fff;border-radius:22px;padding:12px 16px 11px;
  box-shadow:var(--shadow-sm);text-align:center;border:3px solid #fff
}
.score-panel .sp-num{display:flex;align-items:baseline;justify-content:center;gap:4px;line-height:1}
.score-panel .sp-num b{font-size:34px;font-weight:900;color:#e4703b;letter-spacing:-1px}
.score-panel .sp-num span{font-size:13px;font-weight:800;color:var(--ink-soft)}
.score-panel .sp-row{display:flex;justify-content:center;gap:6px;margin-top:8px;flex-wrap:wrap}
.sp-tag{
  font-size:11px;font-weight:900;padding:3px 9px;border-radius:999px;
  background:#f4ece1;color:#9a8778;white-space:nowrap
}
.sp-tag.ok{background:#e3f6ee;color:#1d7a52}
.sp-tag.hot{background:linear-gradient(180deg,#ffe08a,#ffc247);color:#8a5a00}

/* 2) 拼音卡片：三张排成一行、纵向排布不重叠 */
#cards.one-row{flex-wrap:nowrap;gap:14px;justify-content:center}
#cards.one-row .pcard.tone-card{
  width:auto;min-width:0;flex:1 1 0;max-width:150px;height:150px;
  padding:16px 8px 12px;justify-content:center;gap:8px
}
.pcard.tone-card{display:flex;flex-direction:column;align-items:center;justify-content:center}
.pcard.tone-card .num{position:absolute;left:10px;top:8px;font-size:11px;font-weight:900;color:#cbb5a1}
.pcard.tone-card .speaker{font-size:22px;line-height:1;opacity:.85}
.pcard.tone-card .py{
  font-family:"Times New Roman",Georgia,serif;font-size:32px;font-weight:700;line-height:1.1;
  letter-spacing:.5px;white-space:nowrap
}
.pcard.tone-card .tip{font-size:11px;font-weight:800;color:#bfa892;margin-top:2px}
/* 已选中：只改边框与底色，不再加绝对定位的角标（避免与"点击听"重叠） */
.pcard.tone-card.picked{
  border-color:#63b4ff;background:#f2f9ff;
  box-shadow:0 5px 0 rgba(99,180,255,.3),0 14px 26px rgba(99,180,255,.22)
}
.pcard.tone-card.picked .tip{color:#3f8fe0}
.pcard.tone-card.picked .tip::after{content:" · 已选中"}
.pcard.tone-card.picked::after{content:none}
.pcard.tone-card.correct{transform:scale(1.04)}
.pcard.tone-card.reveal .py{font-size:34px}
.pcard.tone-card.wrong{border-color:var(--red);background:#ffecec}
.pcard.reveal-answer{border-color:var(--green);border-style:dashed;background:#f2fff9}

/* 3) 二字卡片（声声不息 / 余韵缭绕） */
#cards.two-cards{gap:20px}
.pcard.hanzi-card{
  width:150px;min-height:150px;justify-content:center;gap:8px;padding:14px 10px
}
.pcard.hanzi-card .char{font-size:46px;font-weight:800;line-height:1.05}
.pcard.hanzi-card .tip{font-size:11px}
.pcard.hanzi-card .speaker{font-size:22px;opacity:.85}

/* 4) 得分明细条：答对 +1 / 连击 +1 分开 */
.gain-row{
  display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
  margin-top:14px;animation:nextIn .32s cubic-bezier(.2,1.5,.4,1)
}
.g-chip{
  display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:900;
  padding:6px 13px;border-radius:999px;background:#e3f6ee;color:#1d7a52
}
.g-chip b{font-size:15px}
.g-chip.hot{background:linear-gradient(180deg,#ffe08a,#ffc247);color:#8a5a00}
.g-chip.miss{background:#ffe4e4;color:#c93b3b}
.g-note{font-size:12px;font-weight:800;color:#c08a2e}

/* 5) 成绩单：答对得分 / 连击得分 分开列 */
.score-break{
  background:#fff;border-radius:18px;padding:12px 14px;margin:6px 0 12px;
  box-shadow:var(--shadow-sm)
}
.sb-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:6px 0;font-size:13px;font-weight:800;color:var(--ink-soft)
}
.sb-row + .sb-row{border-top:1px dashed var(--line)}
.sb-row .sb-val b{font-size:17px;color:#e4703b}
.sb-row.bonus .sb-val b{color:#1d7a52}
.sb-total{
  display:flex;align-items:center;justify-content:space-between;
  margin-top:8px;padding-top:9px;border-top:2px solid var(--line);
  font-size:14px;font-weight:900
}
.sb-total b{font-size:26px;color:#d1500f}
.tiny-hot{
  font-style:normal;font-size:10px;font-weight:900;color:#8a5a00;background:#ffe7ab;
  padding:1px 6px;border-radius:999px;margin-left:4px
}
.rrow .txt{display:flex;align-items:center;flex-wrap:wrap;gap:4px}

/* 选项禁用态 */
.opt:disabled,.tone-choice:disabled{cursor:default}
.opt:disabled:hover,.tone-choice:disabled:hover{transform:none;border-color:#f3e8db}
.tone-choice.reveal-answer{border-color:var(--green);border-style:dashed;background:#f2fff9}

@media (max-width:820px){
  .score-panel{min-width:118px;padding:9px 10px 8px}
  .score-panel .sp-num b{font-size:26px}
  .sp-tag{font-size:10px;padding:2px 7px}
  #cards.one-row{gap:8px}
  #cards.one-row .pcard.tone-card{height:112px;padding:12px 4px 8px}
  .pcard.tone-card .py{font-size:21px}
  .pcard.tone-card .speaker{font-size:17px}
  .pcard.tone-card .tip{font-size:10px}
  .pcard.tone-card.reveal .py{font-size:22px}
  .pcard.tone-card .num{left:6px;top:5px;font-size:10px}
  .pcard.hanzi-card{width:calc(50% - 10px);min-height:120px}
  .pcard.hanzi-card .char{font-size:38px}
  .sb-row{font-size:12px}
  .sb-row .sb-val b{font-size:15px}
}

function plainOf(item) {
  const fin = (item.fin || '').replace(/ü/g, 'v');
  return (item.ini || '') + fin;

/* ── 关于网页朗读的两个硬约束（这是"慢"和"念错"的真正原因） ──
   ① 每次调用 speechSynthesis.cancel()，Chrome / Edge 都要重新初始化引擎，
      下一句要等 300~800ms 才出声；
   ② 旧句子如果没被取消，会一直占着队列，新句子只能排在它后面 ——
      听起来就是"点了这一张，等半天，才念出上一张"。
   两个约束互相冲突，所以这里全程不 cancel：
       · 要换话时，先把旧句子音量调成 0（听不见，但它照常瞬间走完）
       · 新句子立刻 speak 排队，等旧句子"哑着"结束就马上开始
     代价是每句有极短的交接，但避免了引擎重置和错位。 */
const Voice = {
  zhVoice: null, muted: false, rate: 1.5, _live: [], _ready: false, _tok: 0, _endAt: 0,

  init() {
    if (!('speechSynthesis' in window)) return;
    const load = () => {
      const vs = speechSynthesis.getVoices();
      if (!vs.length) return;
      const zh = vs.filter(v => /^zh|cmn/i.test(v.lang));
      const score = v => {
        let s = 0;
        if (/zh[-_]CN/i.test(v.lang)) s += 30;
        /* 各平台念汉字最准的几家系统音 */
        if (/xiaoxiao|yunxi|xiaoyi|yunyang|tingting|meijia|huihui|kangkang|google/i.test(v.name)) s += 20;
        if (/Microsoft|Google|Apple/i.test(v.name)) s += 10;
        if (/localService/i.test(v.name)) s -= 20;
        if (v.localService === false) s += 8;
        return s;
      };
      this.zhVoice = zh.sort((a, b) => score(b) - score(a))[0] || null;
    };
    load();
    speechSynthesis.onvoiceschanged = load;
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && speechSynthesis.paused) speechSynthesis.resume();
    });
  },

  /* 用户手势里调用一次，确保引擎处于可发声状态 */
  prime() {
    if (this._ready || !('speechSynthesis' in window)) return;
    this._ready = true;
    try { if (speechSynthesis.paused) speechSynthesis.resume(); } catch (e) {}
  },

  /* 静音手上所有句子，但不打断引擎（关键：不 cancel） */
  _silence() {
    this._live.forEach(u => { try { u.volume = 0; } catch (e) {} });
    this._live = [];
  },

  /* 换题 / 暂停时用：静音 + 让队列尽快走完（仍不 cancel） */
  hush() {
    this._silence();
    this._endAt = 0;
  },

  /* 朗读一句。opts.queue=true 表示排在当前句之后（用于选项反馈音）。 */
  speak(text, rate, opts) {
    if (this.muted || !text || !('speechSynthesis' in window)) return;
    const syn = speechSynthesis;
    const queue = !!(opts && opts.queue);
    if (!queue) this._silence();
    try {
      if (syn.paused) syn.resume();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'zh-CN';
      u.rate = rate || this.rate;
      u.pitch = 1.02;
      u.volume = 1;
      if (this.zhVoice) u.voice = this.zhVoice;
      u.onend = u.onerror = () => {
        this._live = this._live.filter(x => x !== u);
        if (!this._live.length) this._endAt = 0;
      };
      this._live.push(u);
      syn.speak(u);
      /* 兜底：单字/短词 0.9 秒足够，超时只是把音量归零，不 cancel */
      if (!queue) {
        const tok = ++this._tok;
        setTimeout(() => {
          if (tok === this._tok) { try { u.volume = 0; } catch (e) {} }
        }, 900);
      }
    } catch (e) { /* 静默失败 */ }
  },

  /* 读一个拼音：① 同音字 ② 词语定音 ③ 带调拼音兜底 */
  speakPinyin(item, rate) {
    if (!item) return;
    const r = rate || this.rate;
    const ini = item.ini || '';
    const fin = item.fin || '';
    if (item.asInitial && ini) { this.speak(SPOKEN.initial[ini] || ini, r); return; }
    const tone = item.tone || 0;
    const syl = plainOf(item);
    /* ⓪ 配好音的字：声调题里每张卡都指定了"读哪个字"，
       这样两张同调卡一定是同一个音，异类卡一定是另一个音，不会听混 */
    if (item.say) { this.speak(item.say, r); return; }
    /* ① 同音字：孩子听到的就是那个字的读音，绝对不会串到别的音 */
    if (tone && SAY[syl] && SAY[syl][tone] && SAY[syl][tone].length) {
      this.speak(SAY[syl][tone][0], r);
      return;
    }
    /* ② 词语定音：多音字放在词里读 */
    const ph = PHRASE[syl + tone];
    if (ph) { this.speak(ph.word, r * 0.95); return; }
    /* ③ 兜底 */
    const py = (item.pinyin || '').trim();
    if (py) { this.speak(py, r); return; }
    this.speak(SPOKEN.final[fin] || fin || ini, r);
  },

  /* 只在"暂停 / 回首页"这种确实要彻底安静时调用 */
  stop() {
    this.hush();
    try { speechSynthesis.cancel(); } catch (e) {}
  }
};

const PER_Q = 4;   // 每题 4 张拼音卡 / 4 个选项

const takeChar = (entry, used) => {
  const pool = entry.chars.filter(c => !used.has(c));
  const list = pool.length ? pool : entry.chars;
  const head = list.slice(0, Math.max(1, Math.ceil(list.length * 0.75)));
  return pick(head);
};

/* 声母 / 韵母模式只是让孩子认"读音差异"，不需要认识卡片上的字，
   所以卡片上的字直接用 SAY 表的代表字 —— 那个字读出来一定不跑调。 */
/* 有些声调的代表字太生僻（鸲 / 隳 / 茴），孩子不认识、引擎也容易读歪。
   这类字不进卡片，宁可退回字库里自带的字。 */
const RARE = new Set('鸲隳茴逋跋猖猢醐麸茯芾芨茼荸莩萜蓊薏藿牦鹚鹕鹁鸪鸵鹬鹭鸶鸫鹗鸱鸺鹠鹁鹆鹇鹈鹕鹱鹳'.split(''));
const usable = c => !!c && !RARE.has(c);
const sayCharOf = (item) => {
  const t = SAY[plainOf(item)] && SAY[plainOf(item)][item.tone || 0];
  return usable(t && t[0]) ? t[0] : '';
};
const cardChar = (item, entry) => sayCharOf(item) || takeChar(entry, new Set());

/* 同一音节取 3 张卡：两个声调相同（同音不同字）、一个声调不同。
   玩家需同时指出"哪张卡片"和"它的声调"，两者都对才算答对。 */

/* 朗读用的字：优先用 SAY 表里为这个声调配好的"唯一代表字" */
function speakCharOf(key, tone) {
  const t = SAY[key] && SAY[key][tone];
  return (t && t[0]) || '';
}

/* 这一对声调，耳朵分得开吗？
   三声是"先降后升"的曲折调，一声高平、四声高降、二声中升。
   一声 vs 三声、二声 vs 三声 在单字朗读里最容易糊在一起（引擎的三声常常只降不升），
   所以出题只在"整组卡片里每个读音都听得出区别"的声调组合中挑：
       一声 / 二声 —— 高平 vs 中升   （清楚）
       一声 / 四声 —— 高平 vs 高降   （最清楚）
       二声 / 四声 —— 中升 vs 高降   （清楚）

      if (major.chars.filter(c => c && c !== '').length < 2) return;
      spoken.forEach(odd => {
        if (odd.tone === major.tone) return;
        if (!TONE_PAIR_OK[pairKey(major.tone, odd.tone)]) return;
        /* 两张卡朗读的字必须真的不同 —— 否则听到的就是同一个音 */
        const mSay = speakCharOf(s.key, major.tone);
        const oSay = speakCharOf(s.key, odd.tone);
        if (!usable(mSay) || !usable(oSay) || mSay === oSay) return;
        /* 卡片上显示的字也别用生僻字 */
        const charsM = major.chars.filter(c => usable(c));
        const charsO = odd.chars.filter(c => usable(c));
        if (charsM.length < 2 || !charsO.length) return;
        units.push({ s, major, odd, mSay, oSay, charsM, charsO });
      });
    });
  });
  return units;
})();

function buildToneQuestions(count) {
  if (!TONE_UNITS.length) return [];
  const out = [];
  let guard = 0;
  /* 先把候选打散，按顺序取 —— 这样一个音节的不同声调组合会自然铺开，
     不会连续几题都落在同一个音节上 */
  const deck = shuffle(TONE_UNITS);
  while (out.length < count && guard++ < 6000) {
    const u = deck[out.length % deck.length];
    if (!u) continue;
    const { s, major, odd, mSay, oSay, charsM, charsO } = u;

    /* 同一张卡读出来的字固定用代表字，保证"听到的"和"看到的"一一对应 */
    const items = [
      { tone: major.tone, pinyin: major.pinyin, char: charsM[0], say: mSay },
      { tone: major.tone, pinyin: major.pinyin, char: charsM[1], say: mSay },
      { tone: odd.tone, pinyin: odd.pinyin, char: charsO[0], say: oSay }
    ];
    if (new Set(items.map(i => i.char)).size !== 3) continue;
    if (new Set(items.map(i => i.say)).size !== 2) continue;

    const shuffled = items.map(it => ({ ...it, ini: s.ini, fin: s.fin, key: s.key }));
    const final = shuffle(shuffled);
    const answerIndex = final.findIndex(i => i.tone === odd.tone);
    if (answerIndex < 0) continue;
    final.forEach((it, i) => { it.odd = i === answerIndex; });

    out.push({
      key: s.key, type: 'tone', mode: 'tone', items: final,
      answerIndex,
      answerTone: odd.tone,
      majorTone: major.tone
    });
  }
  return out;
}

/* ---------- 模式二：声母 ---------- */
/* 2 张卡片：声母相同、韵母不同（同声母不同韵母，才能听出共同声母） */
function buildInitialQuestions(count, variant, cardCount = 2) {
  const byIni = {};
  SYLLABLES.forEach(s => {
    if (!s.ini) return;                       // 零声母不参与声母题
    (byIni[s.ini] = byIni[s.ini] || []).push(s);
  });
  const usable = Object.keys(byIni).filter(i => byIni[i].length >= cardCount);
  const out = [];
  let guard = 0;
  while (out.length < count && guard++ < 3000) {
    const ini = pick(usable);
    const pool = byIni[ini];
    const fins = [...new Set(pool.map(s => s.fin))];
    let items = [];

    if (cardCount === 2) {
      /* 两卡：韵母必须不同，声调能统一就统一（方便孩子只关注韵母差异） */
      if (fins.length < 2) continue;
      const chosen = shuffle(fins).slice(0, 2).map(f => pool.find(s => s.fin === f));
      const common = [1, 2, 3, 4].find(t => chosen.every(s => s.entries.some(e => e.tone === t)));
      items = chosen.map(s => {
        const e = (common && s.entries.find(x => x.tone === common)) || pickE(s);
        return { tone: e.tone, pinyin: e.pinyin, char: cardChar({ tone: e.tone, ini: s.ini, fin: s.fin }, e), ini: s.ini, fin: s.fin };
      });
    } else if (variant === 'finalOnly') {
      /* 韵母全不同；声调能统一就统一 */
      if (fins.length < PER_Q) continue;
      const chosen = shuffle(fins).slice(0, PER_Q).map(f => pool.find(s => s.fin === f));
      const common = [1, 2, 3, 4].find(t => chosen.every(s => s.entries.some(e => e.tone === t)));
      items = chosen.map(s => {
        const e = (common && s.entries.find(x => x.tone === common)) || pickE(s);
        return { tone: e.tone, pinyin: e.pinyin, char: cardChar({ tone: e.tone, ini: s.ini, fin: s.fin }, e), ini: s.ini, fin: s.fin };
      });
    } else if (variant === 'toneOnly') {
      /* 声调尽量各不相同；韵母尽量统一（找不到就放宽） */
      const buckets = {};
      pool.forEach(s => (buckets[s.fin] = buckets[s.fin] || []).push(s));
      const multiFin = Object.keys(buckets)
        .filter(f => buckets[f].length >= 3)
        .sort((a, b) => buckets[b].length - buckets[a].length);
      const finOrder = multiFin.length ? shuffle(multiFin.slice(0, 3)) : shuffle(fins);
      for (const f of finOrder) {
        const group = buckets[f] || [];
        if (group.length < 3) continue;
        const tmp = [];
        const seen = new Set();
        for (const s of shuffle(group)) {
          const e = pickE(s);
          if (!e) continue;
          tmp.push({ tone: e.tone, pinyin: e.pinyin, char: cardChar({ tone: e.tone, ini: s.ini, fin: s.fin }, e), ini: s.ini, fin: s.fin });
          seen.add(e.tone);
        }
        if (tmp.length >= 3) { items = tmp.slice(0, PER_Q); break; }
      }
      if (!items.length) {
        // 放宽：同声母下声调尽量分散
        const tmp = [];
        for (const s of shuffle(pool)) {
          const e = pickE(s);
          if (!e) continue;
          tmp.push({ tone: e.tone, pinyin: e.pinyin, char: cardChar({ tone: e.tone, ini: s.ini, fin: s.fin }, e), ini: s.ini, fin: s.fin });
          if (tmp.length >= PER_Q) break;
        }
        items = tmp;
      }
    } else {
      /* 随机不同：韵母不重复，声调随机 */
      if (fins.length < PER_Q) continue;
      items = shuffle(fins).slice(0, PER_Q).map(f => {
        const s = pool.find(x => x.fin === f);
        const e = pickE(s);
        return { tone: e.tone, pinyin: e.pinyin, char: cardChar({ tone: e.tone, ini: s.ini, fin: s.fin }, e), ini: s.ini, fin: s.fin };
      });
    }
    if (items.length < Math.min(3, cardCount)) continue;
    out.push({ type: 'initial', mode: 'initial', items, answer: ini, shownAnswer: ini, ask: '声母' });
  }
  return out;
}

/* ---------- 模式三：韵母 ---------- */
function buildFinalQuestions(count, variant, cardCount = 2) {
  const byFin = {};
  SYLLABLES.forEach(s => (byFin[s.fin] = byFin[s.fin] || []).push(s));
  const usable = Object.keys(byFin).filter(f => {
    const inis = new Set(byFin[f].map(s => s.ini).filter(Boolean));
    return inis.size >= 4;
  });
  const out = [];
  let guard = 0;
  while (out.length < count && guard++ < 3000) {
    const fin = pick(usable);
    const pool = byFin[fin];
    const inis = [...new Set(pool.map(s => s.ini))].filter(Boolean);
    if (inis.length < cardCount) continue;
    const chosen = shuffle(inis).slice(0, cardCount).map(i => pool.find(s => s.ini === i));
    let items;

    if (variant === 'initialOnly') {
      const common = [1, 2, 3, 4].find(t => chosen.every(s => s.entries.some(e => e.tone === t)));
      items = chosen.map(s => {
        const e = (common && s.entries.find(x => x.tone === common)) || pickE(s);
        return {
          tone: e.tone, pinyin: e.pinyin, char: cardChar({ tone: e.tone, ini: s.ini, fin: s.fin }, e),
          ini: s.ini, fin: s.fin, shownFin: finDisplay(s.ini, s.fin)
        };
      });
    } else {
      items = chosen.map(s => {
        const e = pickE(s);
        return {
          tone: e.tone, pinyin: e.pinyin, char: cardChar({ tone: e.tone, ini: s.ini, fin: s.fin }, e),
          ini: s.ini, fin: s.fin, shownFin: finDisplay(s.ini, s.fin)
        };
      });
      if (variant === 'toneOnly' && new Set(items.map(i => i.tone)).size < 2) continue;
    }
    out.push({
      type: 'final', mode: 'final', items,
      answer: fin, shownAnswer: finDisplay(items[0].ini, fin), ask: '韵母'
    });
  }
  return out;
}

/* ---------- 干扰项 ---------- */
const NEAR = {
  initial: { b:'p', p:'b', d:'t', t:'d', g:'k', k:'g', m:'n', n:'l', l:'n', j:'q', q:'j', x:'s', s:'x',
    zh:'ch', ch:'zh', sh:'s', z:'zh', c:'ch', r:'l', f:'h', h:'f', y:'w', w:'y' },
  final: { a:'ai', ai:'a', an:'ang', ang:'an', en:'eng', eng:'en', in:'ing', ing:'in', ie:'üe', üe:'ie',
    uo:'ou', ou:'uo', ian:'iang', iang:'ian', uan:'uang', uang:'uan', un:'ün', ün:'un', ui:'ei', ei:'ui',
    iu:'iao', iao:'iu', er:'e', ü:'u', u:'ü' }
};

function buildOptions(question) {
  const kind = question.type === 'initial' ? 'initial' : 'final';
  const pool = kind === 'initial' ? INITIALS : FINALS;
  const answer = question.answer;
  const valid = new Set();
  if (kind === 'initial') SYLLABLES.forEach(s => { if (s.ini) valid.add(s.ini); });
  else SYLLABLES.forEach(s => valid.add(s.fin));

  const cands = pool.filter(p => p !== answer);
  const nearOnes = cands.filter(p => NEAR[kind][p] === answer || NEAR[kind][answer] === p);
  const restValid = cands.filter(p => !nearOnes.includes(p) && valid.has(p));
  const restAll = cands.filter(p => !nearOnes.includes(p));

  const picked = [];
  const add = p => { if (p && !picked.includes(p) && p !== answer) picked.push(p); };
  shuffle(nearOnes).forEach(add);
  shuffle(restValid).forEach(add);
  shuffle(restAll).forEach(add);

  return shuffle([answer, ...picked.slice(0, 3)]).map(v => ({
    value: v, label: v, spoken: SPOKEN[kind][v] || v
  }));
}

document.getElementById('root').innerHTML = APP;

/* ================= 配置 ================= */
const TOTAL_Q = 16;               // 每轮固定 16 题
const COMBO_BASE = 6;             // 连对超过 6 题后，从第 7 题起每题额外 +1 连击分
const CARD_COUNT = { initial: 2, final: 2, tone: 3 };

const MODES = {
  initial: {
    name: '声声不息', color: '#63b4ff', icon: '🅱️',
    variant: 'random', tag: '听音辨声母',
    intro: '点击卡片听发音，选出它们相同的声母'
  },
  final: {
    name: '余韵缭绕', color: '#a78bfa', icon: '🅰️',
    variant: 'random', tag: '听音辨韵母',
    intro: '点击卡片听发音，选出它们相同的韵母'
  },
  tone: {
    name: '阴阳平仄', color: '#ff8a5b', icon: '♪',
    variant: 'find', tag: '找出异类',
    intro: '先点卡片听发音，找出声调不同的那一张，再选它的声调'
  }
};
const MODE_ORDER = ['initial', 'final', 'tone'];

const State = {
  mode: 'initial',
  variant: 'random',
  count: TOTAL_Q,
  questions: [],
  qi: 0,
  combo: 0,          // 当前连对
  maxCombo: 0,       // 本轮最高连对
  base: 0,           // 答对得分（每题 +1）
  comboBonus: 0,     // 连击加成累计
  correct: 0,
  wrong: 0,          // 答错题数
  records: [],
  startAt: 0,
  elapsed: 0,
  locked: false,     // 本题是否已结算
  pickedCard: -1,
  paused: false,
  lastSyl: null    // 上一轮用过的音节（仅用于跨轮去重）
};
const scoreTotal = () => State.base + State.comboBonus;

const STORE_KEY = 'py-puzzle-records-v2';
const OLD_KEY = 'py-puzzle-records-v1';

/* ================= 积分 & 星级 ================= */
/* 答对：基础 +1；连对超过 6 题后，从第 7 题起每题再 +1 连击分。
   答错：连击清零，本题 0 分。每题只判一次。 */
function awardCorrect() {
  State.combo++;
  if (State.combo > State.maxCombo) State.maxCombo = State.combo;
  const bonus = State.combo > COMBO_BASE ? 1 : 0;
  State.base += 1;
  State.comboBonus += bonus;
  return { base: 1, bonus };
}
function resetCombo() { State.combo = 0; }

/* 星级：<6 → 0 星；6~8 → 1 星；9~15 → 2 星；16 → 3 星 */
function starsOf(correct, total) {
  const n = total || TOTAL_Q;
  if (correct >= n) return 3;
  if (correct >= 9) return 2;
  if (correct >= 6) return 1;
  return 0;
}
/* 星级奖励：2 星 +1，3 星 +2，其余 0 */
function starBonusOf(stars) {
  if (stars >= 3) return 2;
  if (stars === 2) return 1;
  return 0;
}

/* ================= 首页 ================= */
function renderHomeScore() {
  const all = loadRecords();
  const total = all.reduce((s, r) => s + (r.total || 0), 0);
  const stars = all.reduce((s, r) => s + (r.stars || 0), 0);
  document.getElementById('homeScore').innerHTML = `
    <div class="score-chip">
      <span class="sc-ico">🏆</span>
      <span class="sc-main"><b>${total}</b><small>总积分</small></span>
      <span class="sc-side">${stars} ⭐ · ${all.length} 轮</span>
    </div>`;
}

document.getElementById('modeGrid').addEventListener('click', e => {
  const card = e.target.closest('.mode-card');
  if (!card) return;
  startRound(card.dataset.mode);
});

/* ================= 开始一轮 ================= */
function buildQuestions(mode) {
  const n = CARD_COUNT[mode] || 2;
  let qs;
  if (mode === 'tone') qs = buildToneQuestions(State.count);
  else if (mode === 'initial') qs = buildInitialQuestions(State.count, 'random', n);
  else qs = buildFinalQuestions(State.count, 'random', n);

  /* 相邻两题不能是同一个音节 —— 音频一换一换地重复，孩子会以为是同一题 */
  const seen = State.lastSyl;
  if (seen) {
    const moved = qs.filter(q => {
      const k = q.key || (q.items[0] && q.items[0].key);
      return k !== seen;
    });
    if (moved.length >= State.count) qs = moved;
  }
  const first = qs[0] && (qs[0].key || (qs[0].items[0] && qs[0].items[0].key));
  State.lastSyl = first || null;
  return qs;
}

function startRound(mode) {
  State.mode = mode || State.mode;
  State.variant = MODES[State.mode].variant;
  State.count = TOTAL_Q;
  Voice.prime();         // 这次点击是用户手势，正好把语音引擎点亮

  let qs = buildQuestions(State.mode);
  if (qs.length < State.count) {
    let guard = 0;
    while (qs.length < State.count && guard++ < 20) {
      const more = buildQuestions(State.mode);
      if (!more.length) break;
      qs = qs.concat(more).slice(0, State.count);
    }
  }
  State.count = qs.length;
  State.questions = qs;
  State.qi = 0;
  State.combo = 0;
  State.maxCombo = 0;
  State.base = 0;
  State.comboBonus = 0;
  State.correct = 0;
  State.wrong = 0;
  State.records = [];
  State.startAt = Date.now();
  State.elapsed = 0;
  State.locked = false;
  State.paused = false;
  State.pickedCard = -1;

  document.getElementById('screenHome').classList.add('hidden');
  document.getElementById('screenGame').classList.remove('hidden');
  document.getElementById('btnPause').classList.remove('hidden');
  document.getElementById('gameModeName').textContent = MODES[State.mode].name;
  document.getElementById('gameVariantName').textContent = MODES[State.mode].tag;

  updateScorePanel();
  updateProgress();
  showQuestion();
}

function updateScorePanel() {
  document.getElementById('spScore').textContent = scoreTotal();
  document.getElementById('spCorrect').textContent = `答对 ${State.correct} 题`;
  const c = State.combo;
  const el = document.getElementById('spCombo');
  const gain = c > COMBO_BASE;
  el.textContent = c >= 2 ? `连对 ${c}${gain ? ' · 加成 +1' : ''}` : '连对 0';
  el.classList.toggle('hot', gain);
}

function updateProgress() {
  const n = State.questions.length || State.count;
  document.getElementById('progressBar').style.width = (State.qi / n) * 100 + '%';
  document.getElementById('progressText').textContent = `${Math.min(State.qi + 1, n)} / ${n}`;
}

/* ================= 渲染题目 ================= */
function stripTone(py) {
  const map = { 'ā':'a','á':'a','ǎ':'a','à':'a','ō':'o','ó':'o','ǒ':'o','ò':'o',
    'ē':'e','é':'e','ě':'e','è':'e','ī':'i','í':'i','ǐ':'i','ì':'i',
    'ū':'u','ú':'u','ǔ':'u','ù':'u','ǖ':'v','ǘ':'v','ǚ':'v','ǜ':'v' };
  return [...py].map(c => map[c] || c).join('');
}
const TONE_MARK = { 1: 'ˉ', 2: 'ˊ', 3: 'ˇ', 4: 'ˋ' };
const TONE_NAME = { 1: '第一声', 2: '第二声', 3: '第三声', 4: '第四声' };

function showQuestion() {
  State.locked = false;
  State.pickedCard = -1;
  /* 换题时把上一题的余音静音。
     注意这里只"静音"不 cancel：cancel 会让语音引擎重新初始化，
     导致下一题第一声要等好几百毫秒，还会把旧句子挂住。 */
  Voice.hush();
  document.getElementById('btnNext')?.remove();
  const q = State.questions[State.qi];
  if (!q) return;
  const isTone = q.type === 'tone';

  const askLine = document.getElementById('askLine');
  const hintLine = document.getElementById('hintLine');
  const cards = document.getElementById('cards');
  const options = document.getElementById('options');
  const picker = document.getElementById('tonePicker');

  askLine.innerHTML = isTone
    ? `听一听，哪一张卡片的<span class="hl">声调</span>和大家不一样？`
    : `听一听，这些拼音的<span class="hl">${q.ask}</span>是什么？`;
  hintLine.textContent = MODES[State.mode].intro;
  cards.classList.toggle('one-row', isTone);
  cards.classList.toggle('two-cards', !isTone && q.items.length <= 2);

  if (isTone) {
    /* 3 张卡片排成一行：序号 / 喇叭 / 拼音 / 提示，互不重叠 */
    cards.innerHTML = q.items.map((it, i) => `
      <button class="pcard tone-card" data-i="${i}">
        <span class="num">${i + 1}</span>
        <span class="speaker">🔈</span>
        <span class="py">${stripTone(it.pinyin)}</span>
        <span class="tip">点击听</span>
      </button>`).join('');
    options.classList.add('hidden');
    options.innerHTML = '';
    picker.classList.remove('hidden');
    picker.innerHTML = [1, 2, 3, 4].map(t => `
      <button class="tone-choice" data-t="${t}">
        <span class="tc-mark">${TONE_MARK[t]}</span>
        <span class="tc-num">${t}</span>
      </button>`).join('');
  } else {
    cards.innerHTML = q.items.map((it, i) => `
      <button class="pcard hanzi-card" data-i="${i}">
        <span class="num">${i + 1}</span>
        <span class="speaker">🔈</span>
        <span class="char">${it.char}</span>
        <span class="tip">点击听</span>
      </button>`).join('');
    picker.classList.add('hidden');
    picker.innerHTML = '';
    options.classList.remove('hidden');
    const opts = buildOptions(q);
    options.innerHTML = opts.map(o => `
      <button class="opt" data-v="${o.value}" data-spoken="${o.spoken}">
        ${o.label}<span class="spk">🔈</span>
      </button>`).join('');
  }
  updateProgress();
}

/* ================= 卡片点击 ================= */
/* 先发声，再结算：
   声调模式 —— 点卡片 = 选中这张（记为本次选择）；
   声母/韵母 —— 点卡片只是听，不消耗选择机会。 */
document.getElementById('cards').addEventListener('click', e => {
  const card = e.target.closest('.pcard');
  if (!card || State.paused) return;
  const i = Number(card.dataset.i);
  const q = State.questions[State.qi];
  if (!q || !q.items[i]) return;

  const it = q.items[i];
  Voice.prime();          // 兜底：即使从首页直接进来，第一次点卡片也能点亮引擎
  /* 语速：单字读得清楚又不拖沓（0.55 太慢，听感像卡住），由 Voice.rate 统一控制 */
  Voice.speakPinyin(it);
  card.classList.add('playing');
  setTimeout(() => card.classList.remove('playing'), 620);

  if (q.type !== 'tone') return;
  if (State.locked) return;
  /* 声调：把这张记为唯一选择，再请玩家选声调 */
  document.querySelectorAll('.pcard.tone-card').forEach(c => c.classList.remove('picked'));
  card.classList.add('picked');
  State.pickedCard = i;
  const hint = document.getElementById('hintLine');
  if (hint) hint.textContent = `已选中第 ${i + 1} 张，再选出它的声调`;
});

/* ================= 声母 / 韵母：选项判定 ================= */
document.getElementById('options').addEventListener('click', e => {
  const btn = e.target.closest('.opt');
  if (!btn || State.locked || State.paused) return;
  const q = State.questions[State.qi];
  if (!q || q.type === 'tone') return;
  Voice.prime();
  /* 这里特意不朗读选项本身：
     1) 会把孩子正在听的卡片读音挤掉；
     2) 排队的话又会拖到下一题才响，听感像"答错了题还念别的音"。
     对错靠视觉反馈（颜色、对勾）就够了。 */
  answerChoice(btn, btn.dataset.v);
});

function answerChoice(btn, value) {
  const q = State.questions[State.qi];
  State.locked = true;                 // 只能选一次
  const ok = value === q.answer;

  document.querySelectorAll('#options .opt').forEach(o => {
    o.disabled = true;
    if (o !== btn) o.classList.add('dim');
  });

  /* 无论对错都揭示拼音与正确答案 */
  document.querySelectorAll('.pcard').forEach((c, idx) => {
    const it = q.items[idx];
    c.classList.add('reveal');
    c.innerHTML = `<span class="num">${idx + 1}</span>
      <span class="py">${it.pinyin}</span>
      <span class="hanzi">${it.char}</span>
      <span class="tip">${q.shownAnswer}</span>`;
  });

  if (ok) {
    btn.classList.add('correct');
    onCorrect(q, q.answer);
  } else {
    btn.classList.add('wrong');
    const rightBtn = document.querySelector(`#options .opt[data-v="${q.answer}"]`);
    if (rightBtn) rightBtn.classList.add('reveal-answer');
    revealTonePickerAnswer(q);
    onWrong(q, q.shownAnswer, `${q.items.map(i => i.char).join('')} → ${q.shownAnswer}`);
  }
}

/* ================= 声调：选卡片 + 选声调 ================= */
document.getElementById('tonePicker').addEventListener('click', e => {
  const btn = e.target.closest('.tone-choice');
  if (!btn || State.locked || State.paused) return;
  const q = State.questions[State.qi];
  if (!q || q.type !== 'tone') return;
  const tone = Number(btn.dataset.t);

  State.locked = true;                 // 只能选一次
  document.querySelectorAll('.tone-choice').forEach(o => {
    o.disabled = true;
    if (o !== btn) o.classList.add('dim');
  });

  const cardEl = State.pickedCard >= 0
    ? document.querySelector(`.pcard.tone-card[data-i="${State.pickedCard}"]`)
    : null;
  const cardOk = State.pickedCard === q.answerIndex;
  const toneOk = tone === q.answerTone;
  const ok = cardOk && toneOk;

  if (ok) {
    btn.classList.add('correct');
    revealTone(q);
    if (cardEl) {
      cardEl.classList.add('correct');
      cardEl.insertAdjacentHTML('beforeend', `<span class="odd-badge">就是它！</span>`);
    }
    onCorrect(q, `${q.items[q.answerIndex].pinyin}（${TONE_NAME[q.answerTone]}）`);
  } else {
    btn.classList.add('wrong');
    if (cardEl) cardEl.classList.add('wrong');
    revealTone(q, true);
    revealTonePickerAnswer(q);
    onWrong(q, `${q.items[q.answerIndex].pinyin}（${TONE_NAME[q.answerTone]}）`,
      `${q.items.map(i => i.char).join('')} → 第 ${q.answerIndex + 1} 张 ${TONE_NAME[q.answerTone]}`);
  }
});

function revealTone(q, keepWrongCard) {
  document.querySelectorAll('.pcard.tone-card').forEach((c, idx) => {
    const it = q.items[idx];
    c.classList.add('reveal');
    if (!(keepWrongCard && c.classList.contains('wrong'))) c.classList.remove('picked');
    c.querySelector('.py').textContent = it.pinyin;
    c.querySelector('.tip').textContent = it.odd ? '声调不同' : '声调相同';
  });
  if (keepWrongCard) {
    const right = document.querySelector(`.pcard.tone-card[data-i="${q.answerIndex}"]`);
    if (right) {
      right.classList.remove('wrong');
      right.classList.add('reveal-answer');
    }
  }
  document.getElementById('tonePicker').classList.add('hidden');
}

function revealTonePickerAnswer(q) {
  if (!q || q.type !== 'tone') return;
  const el = document.querySelector(`#tonePicker .tone-choice[data-t="${q.answerTone}"]`);
  if (el) el.classList.add('reveal-answer');
}

/* ================= 结算 ================= */
function onCorrect(q, shownAnswer) {
  State.correct++;
  const g = awardCorrect();
  State.records.push({
    ok: true,
    answer: shownAnswer,
    pinyin: q.items.map(it => it.pinyin).join(' '),
    chars: q.items.map(it => it.char).join(''),
    base: g.base,
    bonus: g.bonus,
    combo: State.combo,
    comboText: g.bonus ? `连对 ${State.combo} 题` : ''
  });
  updateScorePanel();
  showGainRow(g);
  toast(`答对啦！答对 +1${g.bonus ? '　连击 +1' : ''}`, 'good');
  clearOptionsDisabled();
  const isLast = State.qi >= State.questions.length - 1;
  setTimeout(() => showNextButton(isLast), 420);
}

function onWrong(q, shownAnswer, detailText) {
  State.wrong++;
  resetCombo();
  State.records.push({
    ok: false,
    answer: shownAnswer,
    pinyin: q.items.map(it => it.pinyin).join(' '),
    chars: q.items.map(it => it.char).join(''),
    base: 0,
    bonus: 0,
    combo: 0,
    detailText
  });
  updateScorePanel();
  showGainRow({ base: 0, bonus: 0, wrong: true });
  toast('这道题答错了~', 'bad');
  const isLast = State.qi >= State.questions.length - 1;
  setTimeout(() => showNextButton(isLast), 500);
}

/* 得分明细条：答对 +1 / 连击 +1 分开显示；从连对第 2 题起就提示"已连续答对 N 题" */
function showGainRow(g) {
  document.getElementById('gainRow')?.remove();
  const row = document.createElement('div');
  row.id = 'gainRow';
  row.className = 'gain-row' + (g.wrong ? ' miss' : '');
  if (g.wrong) {
    row.innerHTML = `<span class="g-chip miss">本题 0 分</span>
      <span class="g-chip miss">连击清零</span>`;
  } else {
    row.innerHTML = `<span class="g-chip">答对 <b>+1</b></span>` +
      (g.bonus ? `<span class="g-chip hot">连击 <b>+1</b></span>` : '') +
      (State.combo >= 2 ? `<span class="g-note">已连续答对 ${State.combo} 题</span>` : '');
  }
  document.getElementById('stage').appendChild(row);
}

/* 题目结算后解开按钮禁用（下一题会重建 DOM） */
function clearOptionsDisabled() {
  document.querySelectorAll('#options .opt, .tone-choice').forEach(o => { o.disabled = false; });
}

function showNextButton(isLast) {
  let btn = document.getElementById('btnNext');
  if (!btn) {
    btn = document.createElement('button');
    btn.id = 'btnNext';
    btn.className = 'next-btn';
    btn.addEventListener('click', () => {
      btn.remove();
      document.getElementById('gainRow')?.remove();
      if (btn.dataset.last === '1') { finishRound(); return; }
      State.qi++;
      updateProgress();
      showQuestion();
    });
  }
  btn.dataset.last = isLast ? '1' : '0';
  btn.innerHTML = isLast ? '看成绩 <span class="arr">→</span>' : '下一题 <span class="arr">→</span>';
  if (!btn.isConnected) document.getElementById('stage').appendChild(btn);
}

/* ================= 结束一轮 ================= */
function scoreBreakHTML(rec) {
  return `
    <div class="sb-row">
      <span class="sb-label">答对得分</span>
      <span class="sb-val">${rec.correct} 题 × 1 = <b>${rec.base ?? 0}</b></span>
    </div>
    <div class="sb-row">
      <span class="sb-label">连击得分</span>
      <span class="sb-val">共 <b>${rec.comboBonus ?? 0}</b></span>
    </div>
    ${rec.starBonus ? `<div class="sb-row bonus">
      <span class="sb-label">${rec.stars >= 3 ? '三星奖励' : '二星奖励'}</span><span class="sb-val"><b>+${rec.starBonus}</b></span>
    </div>` : ''}
    <div class="sb-total">
      <span>本轮合计</span><b>${rec.total ?? 0}</b>
    </div>`;
}

function finishRound() {
  const n = State.questions.length || TOTAL_Q;
  const used = State.elapsed + Math.round((Date.now() - State.startAt) / 1000);
  const stars = starsOf(State.correct, n);
  const starBonus = starBonusOf(stars);
  const total = scoreTotal() + starBonus;

  const rec = {
    t: Date.now(),
    mode: State.mode,
    modeName: MODES[State.mode].name,
    variantName: MODES[State.mode].tag,
    count: n,
    correct: State.correct,
    wrong: State.wrong,
    seconds: used,
    maxCombo: State.maxCombo,
    combo: State.maxCombo,
    base: State.base,
    comboBonus: State.comboBonus,
    score: scoreTotal(),
    starBonus,
    total,
    stars,
    detail: State.records.map(r => ({
      ok: r.ok !== false,
      answer: r.answer, pinyin: r.pinyin, chars: r.chars,
      base: r.base || 0, bonus: r.bonus || 0, hasWrong: !r.ok
    }))
  };
  saveRecord(rec);

  const title = stars === 3 ? '全部答对，太棒了！'
    : stars === 2 ? '表现很棒，继续加油！'
    : stars === 1 ? '完成啦，再练练会更厉害！'
    : '别着急，多听几遍一定行！';
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultSub').textContent =
    `${rec.modeName} · ${n} 题 · 用时 ${fmtTime(used)}`;
  document.getElementById('resultStars').innerHTML =
    Array.from({ length: 3 }, (_, i) => `<span class="s ${i < stars ? 'on' : ''}">⭐</span>`).join('');
  document.getElementById('resultScore').innerHTML = scoreBreakHTML(rec);
  document.getElementById('resultGrid').innerHTML = `
    <div class="metric"><b>${State.correct}</b><span>答对题数</span></div>
    <div class="metric"><b>${State.wrong}</b><span>答错题数</span></div>
    <div class="metric"><b>${State.maxCombo}</b><span>最高连对</span></div>
    <div class="metric"><b>${fmtTime(used)}</b><span>用时</span></div>`;
  document.getElementById('roundList').innerHTML = State.records.map((r, i) => {
    const ok = r.ok !== false;
    const right = ok ? `+${(r.base || 0) + (r.bonus || 0)}` : '0';
    const sub = ok && r.bonus ? `<em class="tiny-hot">连击+1</em>` : '';
    return `<div class="rrow">
      <span class="idx ${ok ? 'ok' : 'no'}">${i + 1}</span>
      <span class="py">${r.pinyin || '—'}</span>
      <span class="txt">${r.chars}${r.chars ? ' → ' : ''}${r.answer} ${sub}</span>
      <span class="res ${ok ? 'ok' : 'no'}">${right}</span>
    </div>`;
  }).join('');

  renderHomeScore();
  setTimeout(() => openModal('modalResult'), 700);
}

const fmtTime = s => s < 60 ? s + '秒' : Math.floor(s / 60) + '分' + (s % 60 ? (s % 60) + '秒' : '');

/* ================= 记录存储 ================= */
const Store = {
  mem: [],
  ok: true,
  read() {
    let disk = [];
    try {
      const raw = localStorage.getItem(STORE_KEY);
      disk = raw ? JSON.parse(raw) : [];
      if (!Array.isArray(disk)) disk = [];
    } catch (e) { this.ok = false; disk = []; }
    const map = new Map();
    [...disk, ...this.mem].forEach(r => { if (r && r.t) map.set(r.t + '_' + (r.mode || ''), r); });
    const all = [...map.values()].sort((a, b) => a.t - b.t);
    this.mem = all;
    return all;
  },
  write(arr) {
    this.mem = arr.slice(-300);
    try { localStorage.setItem(STORE_KEY, JSON.stringify(this.mem)); this.ok = true; }
    catch (e) { this.ok = false; }
    return this.ok;
  },
  add(rec) { const all = this.read(); all.push(rec); return this.write(all); }
};
const loadRecords = () => Store.read();
const saveRecord = rec => Store.add(rec);

/* 兼容 v1 旧记录 */
function migrateOld() {
  try {
    const raw = localStorage.getItem(OLD_KEY);
    if (!raw) return;
    const old = JSON.parse(raw);
    if (!Array.isArray(old) || !old.length) return;
    const map = new Map();
    Store.read().forEach(r => { if (r && r.t) map.set(r.t + '_' + (r.mode || ''), r); });
    old.forEach(r => {
      if (!r || !r.t) return;
      const k = r.t + '_' + (r.mode || '');
      if (map.has(k)) return;
      const correct = r.count - (r.wrongQuestions || 0);
      map.set(k, {
        t: r.t, mode: r.mode, modeName: r.modeName || (MODES[r.mode] || {}).name,
        variantName: r.variantName, count: r.count, correct, wrong: r.wrongQuestions || 0,
        seconds: r.seconds || 0, maxCombo: 0, combo: 0,
        base: correct, comboBonus: 0,
        score: correct, starBonus: 0, total: correct,
        stars: r.stars || starsOf(correct, r.count),
        detail: r.detail || []
      });
    });
    Store.write([...map.values()].sort((a, b) => a.t - b.t));
    localStorage.removeItem(OLD_KEY);
  } catch (e) { /* 忽略 */ }
}

function storageHint() {
  return Store.ok ? '' :
    `<div class="store-warn">⚠️ 浏览器阻止了本地存储，这轮记录只在本次打开有效。可点下方「导出记录」保存。</div>`;
}

/* ================= 历史记录 ================= */
let histTab = 'all';
function renderHistory() {
  const all = loadRecords().slice().reverse();
  const totalScore = all.reduce((s, r) => s + (r.total || 0), 0);
  const totalStars = all.reduce((s, r) => s + (r.stars || 0), 0);
  document.getElementById('histSum').innerHTML = `
    <div class="hcard"><b>${totalScore}</b><span>累计积分</span></div>
    <div class="hcard"><b>${totalStars} ⭐</b><span>总星星</span></div>
    <div class="hcard"><b>${all.length}</b><span>完成轮次</span></div>`;

  document.getElementById('histTabs').innerHTML = ['all', ...MODE_ORDER].map(t => {
    const label = t === 'all' ? '全部' : MODES[t].name;
    return `<button class="chip small ${histTab === t ? 'on' : ''}" data-tab="${t}">${label}</button>`;
  }).join('');

  const list = all.filter(r => histTab === 'all' || r.mode === histTab);
  const warn = storageHint();
  if (!list.length) {
    document.getElementById('histList').innerHTML =
      `${warn}<div class="hist-empty">还没有记录，先去玩一轮吧 🌱</div>`;
    return;
  }
  document.getElementById('histList').innerHTML = warn + list.map(r => {
    const color = (MODES[r.mode] || {}).color || '#ccc';
    const d = new Date(r.t);
    const ds = `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    const stars = r.stars || 0;
    return `<button class="hist-item" data-t="${r.t}">
      <span class="dot" style="background:${color}"></span>
      <div class="hi-main">
        <b>${r.modeName || ''} · ${r.count} 题</b>
        <small>${ds} · 答对 ${r.correct ?? '—'} 题 · 用时 ${fmtTime(r.seconds || 0)}</small>
      </div>
      <span class="hi-right">
        <span class="hi-score" style="color:${color}">${r.total ?? 0} 分</span>
        <span class="hi-stars">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</span>
      </span>
      <span class="hi-arrow">›</span>
    </button>`;
  }).join('');
}

/* 单轮详情 */
function showDetail(rec) {
  if (!rec) return;
  const stars = rec.stars || 0;
  const d = new Date(rec.t);
  const ds = `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
  document.getElementById('detailTitle').textContent = rec.modeName || '这一轮';
  document.getElementById('detailSub').textContent = `${ds} · ${rec.count} 题 · 用时 ${fmtTime(rec.seconds || 0)}`;
  document.getElementById('detailStars').innerHTML =
    Array.from({ length: 3 }, (_, i) => `<span class="s ${i < stars ? 'on' : ''}">⭐</span>`).join('');
  document.getElementById('detailScore').innerHTML = scoreBreakHTML(rec);
  document.getElementById('detailGrid').innerHTML = `
    <div class="metric"><b>${rec.correct ?? '—'}</b><span>答对题数</span></div>
    <div class="metric"><b>${rec.wrong ?? '—'}</b><span>答错题数</span></div>
    <div class="metric"><b>${rec.maxCombo ?? rec.combo ?? 0}</b><span>最高连对</span></div>
    <div class="metric"><b>${fmtTime(rec.seconds || 0)}</b><span>用时</span></div>`;
  const detail = rec.detail || [];
  document.getElementById('detailList').innerHTML = detail.length
    ? detail.map((r, i) => {
        const ok = r.ok !== false;
        const sub = ok && r.bonus ? `<em class="tiny-hot">连击+1</em>` : '';
        return `<div class="rrow">
          <span class="idx ${ok ? 'ok' : 'no'}">${i + 1}</span>
          <span class="py">${r.pinyin || '—'}</span>
          <span class="txt">${r.chars || ''}${r.chars ? ' → ' : ''}${r.answer || ''} ${sub}</span>
          <span class="res ${ok ? 'ok' : 'no'}">${ok ? '+' + ((r.base || 0) + (r.bonus || 0)) : '0'}</span>
        </div>`;
      }).join('')
    : `<div class="detail-note">这一轮没有保存到逐题明细（可能是旧版本记录）。</div>`;
  openModal('modalDetail');
}

document.getElementById('histList').addEventListener('click', e => {
  const item = e.target.closest('.hist-item');
  if (!item) return;
  const rec = loadRecords().find(r => String(r.t) === item.dataset.t);
  showDetail(rec);
});
document.getElementById('btnDetailBack').addEventListener('click', () => {
  closeModal('modalDetail');
  openModal('modalHistory');
});
document.getElementById('btnDetailClose').addEventListener('click', () => {
  closeModal('modalDetail');
  closeModal('modalHistory');
});

/* 导出 / 导入 */
function exportRecords() {
  const all = loadRecords();
  const blob = new Blob([JSON.stringify(all, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `发音小能手-记录-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  toast('记录已导出', 'info');
}
function importRecords(file) {
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const arr = JSON.parse(fr.result);
      if (!Array.isArray(arr)) throw new Error('格式不对');
      const map = new Map();
      [...loadRecords(), ...arr].forEach(r => { if (r && r.t) map.set(r.t + '_' + (r.mode || ''), r); });
      Store.write([...map.values()].sort((a, b) => a.t - b.t));
      renderHistory();
      renderHomeScore();
      toast('记录已导入', 'good');
    } catch (e) { toast('文件格式不对', 'bad'); }
  };
  fr.readAsText(file);
}

/* ================= 弹层 ================= */
const openModal = id => document.getElementById(id).classList.add('show');
const closeModal = id => document.getElementById(id).classList.remove('show');
document.querySelectorAll('.modal-mask').forEach(m => {
  m.addEventListener('click', e => {
    if (e.target === m && (m.id === 'modalHistory' || m.id === 'modalDetail')) m.classList.remove('show');
  });
});
document.getElementById('modalHistory').addEventListener('click', e => {
  const c = e.target.closest('[data-tab]');
  if (c) { histTab = c.dataset.tab; renderHistory(); }
});

/* ================= 暂停 ================= */
function pauseGame() {
  if (State.paused) return;
  State.paused = true;
  State.elapsed += Math.round((Date.now() - State.startAt) / 1000);
  Voice.stop();
  openModal('modalPause');
}
function resumeGame() {
  if (!State.paused) return;
  State.paused = false;
  State.startAt = Date.now();
  closeModal('modalPause');
}
document.getElementById('btnPause').addEventListener('click', pauseGame);
document.getElementById('btnResume').addEventListener('click', resumeGame);
document.getElementById('btnRestart').addEventListener('click', () => {
  closeModal('modalPause');
  State.paused = false;
  startRound(State.mode);
});
document.getElementById('btnQuitHome').addEventListener('click', () => {
  closeModal('modalPause');
  State.paused = false;
  backHome();
});

/* ================= 提示与彩带 ================= */
let toastTimer = null;
function toast(text, kind) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.className = 'toast show ' + (kind === 'bad' ? 'bad' : kind === 'info' ? 'info' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1200);
}
function confetti() {
  const colors = ['#ff8a5b', '#ffd166', '#4cc9a0', '#63b4ff', '#a78bfa', '#ff9ec4'];
  const box = document.createElement('div');
  box.className = 'confetti';
  for (let i = 0; i < 70; i++) {
    const el = document.createElement('i');
    el.style.left = Math.random() * 100 + 'vw';
    el.style.background = colors[i % colors.length];
    el.style.animationDuration = (2.2 + Math.random() * 1.6) + 's';
    el.style.animationDelay = (Math.random() * .6) + 's';
    el.style.opacity = .9;
    el.style.width = (6 + Math.random() * 8) + 'px';
    box.appendChild(el);
  }
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 4600);
}

/* ================= 顶部按钮 ================= */
document.getElementById('btnSound').addEventListener('click', e => {
  Voice.muted = !Voice.muted;
  e.currentTarget.textContent = Voice.muted ? '🔇' : '🔊';
  e.currentTarget.classList.toggle('off', Voice.muted);
  if (!Voice.muted) Voice.speak('声音已打开');
});
document.getElementById('btnHistory').addEventListener('click', () => {
  histTab = 'all';
  renderHistory();
  openModal('modalHistory');
});
document.getElementById('btnCloseHistory').addEventListener('click', () => closeModal('modalHistory'));
document.getElementById('btnExport').addEventListener('click', exportRecords);
document.getElementById('btnImport').addEventListener('click', () => document.getElementById('fileImport').click());
document.getElementById('fileImport').addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (f) importRecords(f);
  e.target.value = '';
});

function backHome() {
  Voice.stop();
  closeModal('modalResult');
  closeModal('modalHistory');
  closeModal('modalDetail');
  closeModal('modalPause');
  document.getElementById('gainRow')?.remove();
  document.getElementById('screenGame').classList.add('hidden');
  document.getElementById('screenHome').classList.remove('hidden');
  document.getElementById('btnPause').classList.add('hidden');
  State.paused = false;
  State.questions = [];
  renderHomeScore();
}
document.getElementById('btnBackHome').addEventListener('click', backHome);
document.getElementById('btnAgain').addEventListener('click', () => {
  closeModal('modalResult');
  startRound(State.mode);
});

/* ================= 启动 ================= */
migrateOld();
renderHomeScore();

</script>
</body>
</html>
